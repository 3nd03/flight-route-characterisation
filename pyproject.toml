[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-routes"
version = "0.1.0"
description = "Data-driven characterisation of flight route alternatives and their cost, built for Mercury-style simulators."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "plotly>=5.18",
]

[tool.setuptools.packages.find]
include = ["flight_routes*"]
